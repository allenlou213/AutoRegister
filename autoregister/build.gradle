apply plugin: 'groovy'
// 功能稳定后，上传到maven服务器
apply plugin: 'maven-publish'


dependencies {
    implementation gradleApi()
    implementation localGroovy()
}

repositories {
    mavenCentral()
}
dependencies {
    implementation 'com.android.tools.build:gradle:7.2.2'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'commons-codec:commons-codec:1.15'
}

def artifact_version = '2.0.3'
def artifact_group = 'com.midea.android'
def artifact_id = 'autoregister'
group = artifact_group
version = artifact_version


def hasAndroidPlugin() {
    return getPlugins().inject(false) { a, b ->
        def classStr = b.getClass().name
        def isAndroid = ("com.android.build.gradle.LibraryPlugin" == classStr) || ("com.android.build.gradle.AppPlugin" == classStr)
        a || isAndroid
    }
}

task sourcesJar(type: Jar) {
    if (hasAndroidPlugin()) {
        from android.sourceSets.main.java.srcDirs
        classifier = 'sources'
    } else {
        from sourceSets.main.allSource
        classifier = 'sources'
    }
}

artifacts {
    archives sourcesJar
}

compileJava {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}
//发布前先执行 clean, 避免发布的 aar 中使用了旧的缓存代码
publish.dependsOn clean

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId artifact_group
                artifactId artifact_id
                project.version artifact_version
                from components.java
                artifact sourcesJar
            }
        }
        repositories {
            maven {
                allowInsecureProtocol = true
                credentials {
                    username = "iot-oem"
                    password = "fYW36f6R"
                }
                url = project.version.endsWith("SNAPSHOT") ? "http://mvn.midea.com/nexus/content/repositories/iot-oem-snapshot/" : "http://mvn.midea.com/nexus/content/repositories/iot-oem-release/"
            }
        }
    }
}


